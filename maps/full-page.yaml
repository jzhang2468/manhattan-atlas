# yaml-language-server: $schema=https://docs.maplibre-yaml.org/schema/latest/map.schema.json
#
# The map on full-page-map.html: it fills the window under the site
# header, with zoom buttons, a legend and a layer panel.
type: map
id: full-page
title: Los Angeles Metro Rail
config:
  mapStyle: "style.json"
  center: [-118.2437, 34.0522]
  zoom: 10.5

# MapLibre's own buttons. `navigation` adds zoom in/out and a compass (click
# it to turn the map back to north). Others: scale, fullscreen, geolocate.
# Put in the bottom-right corner so the layer panel sits alone at the top
# right (positions: top-left, top-right, bottom-left, bottom-right).
controls:
  navigation:
    enabled: true
    position: bottom-right

# Where the legend sits: top-left (default), top-right, bottom-left, bottom-right.
legend:
  position: bottom-left

layers:
  # Vector tiles from OpenFreeMap (free, no key): the same tiles the basemap
  # draws, here only their building shapes, in a colour of your own.
  # Starts switched off; tick it in the layer panel.
  - id: buildings
    type: fill
    label: Buildings (zoom 13+)
    visible: false
    legend: false
    source:
      type: vector
      url: "https://tiles.openfreemap.org/planet"
    source-layer: building
    minzoom: 13
    paint:
      fill-color: "#b2182b"
      fill-opacity: 0.35

  # LA Metro Rail GTFS snapshot, 2026-11-13.
  - id: metro-rail-lines
    type: line
    label: Metro Rail lines
    visible: true
    source:
      type: geojson
      url: "data/la-metro-rail-lines.geojson"
    paint:
      line-color: "#174f85"
      line-width: 3
    legend: { label: Metro Rail lines, color: "#174f85", shape: line }

  - id: metro-rail-stations
    type: circle
    label: Metro Rail stations
    visible: true
    source:
      type: geojson
      url: "data/la-metro-rail-stations.geojson"
    paint:
      circle-color: "#b34825"
      circle-radius: 4
      circle-stroke-width: 1.5
      circle-stroke-color: "#ffffff"
    legend: { label: Metro Rail stations, color: "#b34825", shape: circle }
    interactive:
      hover:
        cursor: pointer
      click:
        popup:
          - h3:
              - property: name
          - p:
              - str: "Lines: "
              - property: lines
